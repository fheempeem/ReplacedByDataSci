[project]
name = "bkk-cctv"
version = "0.1.0"
description = "Bangkok CCTV image analysis - DSDE-CEDT 2026/1 project"
requires-python = ">=3.12"
dependencies = [
    "pyducklake[pandas]>=1.0.18",
    "pandas>=2.2",
    "pyarrow>=15",
    "pillow>=10",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.216",
    "streamlit>=1.67.0",
    "pydeck>=0.9.3",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "transformers>=5.24.0",
]

[dependency-groups]
dev = ["ipykernel>=6", "pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
